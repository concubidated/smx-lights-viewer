; SMX UART frame logger - ESP32-S3
;
; Build / flash / monitor (from repo root):
;   source env.sh
;   pio run                 # build
;   pio run -t upload       # flash
;   pio device monitor      # view log

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; This board has 4 MB flash (the devkitc-1 default assumes 8 MB, which
; causes a boot loop: "Detected size(4096k) smaller than ... header(8192k)").
board_upload.flash_size = 4MB
board_upload.maximum_size = 1310720
board_build.partitions = default.csv

monitor_speed = 115200
monitor_filters = time

build_flags =
    ; Log over the S3's native USB port ("USB" connector on DevKitC-1).
    ; To log via the USB-UART bridge ("UART"/CH340 connector) instead,
    ; change both of these to 0.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; GPIO receiving the SMX DATA line (through the divider / buffer).
    -DSMX_RX_PIN=4
    ; Set to 1 if the line turns out to be inverted (idle low).
    -DSMX_RX_INVERT=0
    ; Set to 1 to strip the stray 0x00 byte the BREAK leaves in the FIFO.
    ; Left at 0 initially so we can observe the raw behaviour.
    -DSMX_STRIP_BREAK_NULL=0
    ; 1 = compact binary packets for the web/ overlay bridge (smx_bus.py and
    ; the Python player only read the default hex text, 0).
    -DSMX_OUTPUT_BINARY=0
