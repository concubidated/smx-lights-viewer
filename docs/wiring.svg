<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 320" width="736" height="320" role="img" aria-label="Wiring: RJ-12 pin 3 DATA through a 10k resistor to ESP32-S3 GPIO4, with a 20k resistor from GPIO4 to ground; RJ-12 pin 4 GND connects to ESP32 GND.">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .title { font-size: 16px; font-weight: 600; }
    .muted { fill: #59636e; font-size: 13px; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    .w5 { stroke: #d9730d; stroke-width: 2.5; fill: none; }
    .w3 { stroke: #0969da; stroke-width: 2.5; fill: none; }
    .wg { stroke: #1f2328; stroke-width: 2.5; fill: none; }
    .box { fill: #f6f8fa; stroke: #1f2328; stroke-width: 1.5; }
    .res { fill: #ffffff; stroke: #1f2328; stroke-width: 1.5; }
    .pin { fill: #ffffff; stroke: #1f2328; stroke-width: 1.5; }
    .dot { fill: #1f2328; }
  </style>

  <rect x="0" y="0" width="736" height="320" fill="#ffffff"/>

  <text class="title" x="20" y="30">SMX bus to ESP32-S3</text>
  <text class="muted" x="20" y="50">10k/20k divider, 5 V to 3.3 V</text>

  <line class="w5" x1="430" y1="35" x2="452" y2="35"/>
  <text class="muted" x="458" y="40">DATA 5 V</text>
  <line class="w3" x1="530" y1="35" x2="552" y2="35"/>
  <text class="muted" x="558" y="40">DATA 3.3 V</text>
  <line class="wg" x1="645" y1="35" x2="667" y2="35"/>
  <text class="muted" x="673" y="40">GND</text>

  <g transform="translate(0,50)">
    <rect class="box" x="20" y="50" width="180" height="200" rx="8"/>
    <text class="mid" x="110" y="150">RJ-12 tap</text>
    <text class="muted mid" x="110" y="170">parallel on bus</text>
    <text class="end" x="186" y="90">Pin 3 DATA</text>
    <text class="end" x="186" y="210">Pin 4 GND</text>

    <rect class="box" x="520" y="50" width="196" height="200" rx="8"/>
    <text class="mid" x="618" y="150">ESP32-S3</text>
    <text class="muted mid" x="618" y="170">USB to PC</text>
    <text x="534" y="90">GPIO4 RX</text>
    <text x="534" y="210">GND</text>

    <path class="w5" d="M200 100 H260"/>
    <rect class="res" x="260" y="88" width="80" height="24" rx="3"/>
    <text class="mid" x="300" y="76">R1 10k</text>
    <path class="w3" d="M340 100 H520"/>
    <text class="muted mid" x="230" y="88">5 V</text>
    <text class="muted mid" x="470" y="88">3.3 V</text>

    <path class="w3" d="M410 100 V132"/>
    <rect class="res" x="398" y="132" width="24" height="56" rx="3"/>
    <text x="432" y="165">R2 20k</text>
    <path class="wg" d="M410 188 V220"/>

    <path class="wg" d="M200 220 H520"/>
    <text class="muted mid" x="300" y="240">common ground</text>

    <circle class="dot" cx="410" cy="100" r="4"/>
    <circle class="dot" cx="410" cy="220" r="4"/>
    <circle class="pin" cx="200" cy="100" r="5"/>
    <circle class="pin" cx="200" cy="220" r="5"/>
    <circle class="pin" cx="520" cy="100" r="5"/>
    <circle class="pin" cx="520" cy="220" r="5"/>
  </g>
</svg>
